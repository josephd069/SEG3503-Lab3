@if(items.length === 0) {

  <p class="text-muted">
    Your shopping list is empty.
  </p>

}

<div class="list-group">

  @for (item of items; track $index) {

    <div class="list-group-item d-flex justify-content-between">

        <span>
            {{item}}
        </span>

        <button class="btn btn-danger" (click)="delete($index)">
            Supprimer
        </button>

    </div>

    }

</div>
